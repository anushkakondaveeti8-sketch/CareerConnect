
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aptitude Result - CareerConnect</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2ff;
            text-align: center;
            padding: 60px 15px;
        }
        .result {
            background: white;
            max-width: 450px;
            margin: auto;
            padding: 35px;
            border-radius: 15px;
        }
        h1 { color: #172554; }
        .score { font-size: 28px; color: #2563eb; }
        a { color: #2563eb; }
    </style>
</head>
<body>
<div class="result">
    <h1>Test Completed!</h1>
    <p>Your aptitude practice result:</p>
    <p class="score">
        <span th:text="${score}">0</span> /
        <span th:text="${total}">5</span>
    </p>
    <p>Keep practising to improve your placement readiness.</p>
    <p><a th:href="@{/aptitude}">Try Again</a></p>
    <p><a th:href="@{/dashboard}">Back to Dashboard</a></p>
</div>
</body>
</html>
