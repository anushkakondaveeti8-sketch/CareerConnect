
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Job Opportunities</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5ff;
            padding: 25px;
        }

        .job {
            background: white;
            padding: 18px;
            margin: 15px 0;
            border-radius: 10px;
        }

        button {
            background: #3549a5;
            color: white;
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<h1>CareerConnect - Job Opportunities</h1>

<form th:action="@{/jobs}" method="get"
      style="margin: 20px 0;">

    <input type="text"
           name="keyword"
           placeholder="Search company or job role..."
           th:value="${keyword}"
           style="padding: 10px; width: 280px;">

    <button type="submit"
            style="padding: 10px 18px;">
        Search
    </button>

    <a th:href="@{/jobs}"
       style="margin-left: 10px;">
        Show All Jobs
    </a>

</form>

<div th:if="${#lists.isEmpty(jobs)}">
    <p>No jobs available yet. Please check again later.</p>
</div>

<div class="job" th:each="job : ${jobs}">

    <h2 th:text="${job.companyName}">Company</h2>

    <h3 th:text="${job.jobRole}">Job Role</h3>

    <p>
        <b>Description:</b>
        <span th:text="${job.description}"></span>
    </p>

    <p>
        <b>Eligibility:</b>
        <span th:text="${job.eligibility}"></span>
    </p>

    <p>
        <b>Package:</b>
        <span th:text="${job.salaryPackage}"></span>
    </p>

    <form th:action="@{/jobs/{id}/apply(id=${job.id})}"
          method="post">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <button type="submit">Apply Now</button>

    </form>

</div>

<br>

<a th:href="@{/my-applications}">My Applications</a>
<br><br>
<a th:href="@{/dashboard}">Back to Dashboard</a>

</body>
</html>
