
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Jobs</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f2f5ff;
        }
        input, textarea {
            display: block;
            width: 300px;
            padding: 9px;
            margin: 10px 0;
        }
        button {
            padding: 9px 15px;
            background: #3549a5;
            color: white;
            border: none;
            cursor: pointer;
        }
        .job {
            background: white;
            padding: 15px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<h1>Admin - Manage Jobs</h1>

<h2>Add a New Job</h2>

<form th:action="@{/admin/jobs}" method="post">
    <input type="hidden"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}">

    <input type="text" name="companyName"
           placeholder="Company Name" required>

    <input type="text" name="jobRole"
           placeholder="Job Role" required>

    <textarea name="description"
              placeholder="Job Description" required></textarea>

    <input type="text" name="eligibility"
           placeholder="Eligibility" required>

    <input type="text" name="salaryPackage"
           placeholder="Package (example: 6 LPA)" required>

    <button type="submit">Add Job</button>
</form>

<hr>

<h2>Existing Jobs</h2>


<p th:if="${message}" th:text="${message}"></p>

<div class="job" th:each="job : ${jobs}">
    <h3 th:text="${job.companyName}"></h3>
    <p th:text="${job.jobRole}"></p>
    <p th:text="${job.salaryPackage}"></p>

    <form th:action="@{/admin/jobs/{id}/delete(id=${job.id})}"
          method="post"
          onsubmit="return confirm('Are you sure you want to delete this job?');">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">
         
<a th:href="@{/admin/jobs/{id}/edit(id=${job.id})}">
    <button type="button">Edit Job</button>
</a>
         
        <button type="submit">Delete Job</button>
    </form>
</div>


<br>
<a th:href="@{/admin/applications}">Manage Applications</a>
<br><br>
<a th:href="@{/dashboard}">Back to Dashboard</a>

</body>
</html>
