
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Applications</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 25px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            border: 1px solid #ccc;
            text-align: left;
        }
        th {
            background: #3549a5;
            color: white;
        }
        select, button {
            padding: 7px;
        }
    </style>
</head>
<body>

<h1>Manage Student Applications</h1>

<table>
    <tr>
        <th>Student</th>
        <th>Email</th>
        <th>Company</th>
        <th>Job Role</th>
        <th>Status</th>
        <th>Update</th>
    </tr>

    <tr th:each="app : ${applications}">
        <td th:text="${app.student.fullName}"></td>
        <td th:text="${app.student.email}"></td>
        <td th:text="${app.job.companyName}"></td>
        <td th:text="${app.job.jobRole}"></td>
        <td th:text="${app.status}"></td>
        <td>
            <form th:action="@{/admin/applications/status}"
                  method="post">
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <input type="hidden" name="applicationId"
                       th:value="${app.id}">

                <select name="status">
                    <option value="Pending">Pending</option>
                    <option value="Accepted">Accepted</option>
                    <option value="Rejected">Rejected</option>
                </select>

                <button type="submit">Update</button>
            </form>
        </td>
    </tr>
</table>

<p th:if="${#lists.isEmpty(applications)}">
    No student applications yet.
</p>

<br>
<a th:href="@{/admin/jobs}">Manage Jobs</a> |
<a th:href="@{/dashboard}">Dashboard</a>

</body>
</html>
